name: Go CI Pipeline

on:
  push:
    branches: [ "master", "edeline" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build application
        run: go build -o devscale-app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devscale-app
          path: devscale-app
