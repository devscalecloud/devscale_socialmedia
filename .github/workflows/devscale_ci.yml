name: Go CI Pipeline

on:
  push:
    branches:
      - main
      - winters
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Verify Go installation
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: |
          mkdir -p build
          go build -o build/devscale-socialmedia

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devscale-binary
          path: build/devscale-socialmedia

  deliver:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: devscale-binary
          path: build

      - name: Verify artifact
        run: ls -la build