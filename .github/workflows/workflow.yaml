name: Go Build

on:
  push:
    branches:
      - blaze-feature

jobs:
  setup_build_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout / Clone Repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build Application
        run: go build -o devscale-socialmedia .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: devscale-socialmedia
          path: devscale-socialmedia

  download_and_verify_artifact:
      runs-on: ubuntu-latest
      needs: setup_build_upload

      steps:
        - name: Download Build Artifact
          uses: actions/download-artifact@v7
          with:
            name: devscale-socialmedia
            path: .

        - name: Verify Downloaded Artifact
          run: ls -l devscale-socialmedia
  
  
  
  
  
  
  
  
  
  
  
 